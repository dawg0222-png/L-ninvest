<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Saferoad Lön</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saferoad Lön">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">

<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1115;
  --bg2:#161922;
  --card:#1c202b;
  --card2:#232838;
  --border:#2c3140;
  --text:#eef0f4;
  --text-dim:#9aa1b3;
  --accent:#f5a623;
  --accent-dim:#3a2f1a;
  --good:#4cc38a;
  --warn:#ef6a6a;
  --blue:#5b8cff;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  -webkit-user-select:none; user-select:none;
}
input,textarea{-webkit-user-select:text; user-select:text;}
body{ padding-bottom: calc(84px + var(--safe-bottom)); }
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}

.topbar{
  position:sticky; top:0; z-index:20;
  padding: calc(14px + var(--safe-top)) 16px 12px;
  background:rgba(15,17,21,0.92); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar h1{font-size:19px; font-weight:700; letter-spacing:-0.2px;}
.topbar .sub{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

.months-row{
  display:flex; gap:8px; overflow-x:auto; padding: 12px 16px 4px;
  scrollbar-width:none;
}
.months-row::-webkit-scrollbar{display:none;}
.month-pill{
  flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600;
  background:var(--card); color:var(--text-dim); border:1px solid var(--border); white-space:nowrap;
}
.month-pill.active{ background:var(--accent); color:#171208; border-color:var(--accent); }
.month-pill.add{ background:transparent; border:1px dashed var(--border); color:var(--text-dim); }

.container{ padding:14px 16px 8px; max-width:640px; margin:0 auto; }

.summary-card{
  background:linear-gradient(155deg,var(--card2),var(--card));
  border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:16px;
}
.summary-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.summary-top .label{ font-size:12.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.summary-top .value{ font-size:30px; font-weight:800; margin-top:4px; letter-spacing:-0.5px;}
.summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.summary-mini{ background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.summary-mini .l{ font-size:11.5px; color:var(--text-dim); }
.summary-mini .v{ font-size:16px; font-weight:700; margin-top:2px; }
.breakdown{ margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
.breakdown-row{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--text-dim); }
.breakdown-row b{ color:var(--text); font-weight:600; }

.day-list{ display:flex; flex-direction:column; gap:8px; }
.day-card{
  background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;
}
.day-card.weekend{ border-left:3px solid var(--blue); }
.day-card.has-data{ border-left:3px solid var(--accent); }
.day-head{
  display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer;
}
.day-head .left{ display:flex; align-items:center; gap:10px; }
.day-date{ font-weight:700; font-size:15px; min-width:64px; }
.day-dow{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; }
.day-flags{ display:flex; gap:4px; }
.flag-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }
.day-summary{ text-align:right; font-size:13px; }
.day-summary .hrs{ font-weight:700; color:var(--text); }
.day-summary .rate{ color:var(--good); font-weight:700; font-size:13.5px; }
.day-summary .empty{ color:var(--text-dim); }
.chevron{ margin-left:8px; color:var(--text-dim); transition:transform .18s; font-size:13px; }
.day-card.open .chevron{ transform:rotate(90deg); }

.day-body{ display:none; padding:0 14px 14px; border-top:1px solid var(--border); }
.day-card.open .day-body{ display:block; }

.field-row{ display:flex; gap:10px; margin-top:12px; }
.field{ flex:1; }
.field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; }
input[type=time], input[type=number], input[type=text], input[type=month]{
  width:100%; background:var(--card2); border:1px solid var(--border); border-radius:9px;
  padding:10px 10px; color:var(--text); font-size:16px; font-family:inherit;
}
input::placeholder{ color:#5a6072; }
.toggle-row{ display:flex; gap:10px; margin-top:12px; }
.toggle{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px; border-radius:9px; background:var(--card2); border:1px solid var(--border);
  font-size:13.5px; font-weight:600; color:var(--text-dim);
}
.toggle.on{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
.toggle input{ display:none; }
.notes-row{ margin-top:12px; }
.day-compute{
  margin-top:14px; padding:10px 12px; background:rgba(255,255,255,0.03); border-radius:9px;
  display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:12.5px; color:var(--text-dim);
}
.day-compute b{ color:var(--text); }
.clear-day{
  margin-top:12px; width:100%; padding:9px; border-radius:9px; border:1px solid var(--border);
  background:transparent; color:var(--warn); font-size:13px; font-weight:600;
}

.section-title{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin: 18px 4px 8px; }

.rates-note{
  font-size:11.5px; color:var(--text-dim); line-height:1.5; background:var(--card);
  border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:16px;
}
.rates-note b{ color:var(--text); }

.bottom-actions{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding: 10px 16px calc(12px + var(--safe-bottom));
  background:rgba(15,17,21,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--border);
  display:flex; gap:10px; max-width:640px; margin:0 auto;
}
.btn{
  flex:1; padding:13px; border-radius:11px; border:none; font-size:14.5px; font-weight:700; text-align:center;
}
.btn-primary{ background:var(--accent); color:#171208; }
.btn-secondary{ background:var(--card2); color:var(--text); border:1px solid var(--border); }

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50; display:none;
  align-items:flex-end; justify-content:center;
}
.modal-backdrop.show{ display:flex; }
.modal{
  background:var(--bg2); width:100%; max-width:640px; border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + var(--safe-bottom)); border-top:1px solid var(--border);
  max-height:82vh; overflow-y:auto;
}
.modal h3{ font-size:16px; margin-bottom:12px; }
.modal .field{ margin-bottom:12px; }
.modal-actions{ display:flex; gap:10px; margin-top:8px; }
textarea.data-io{
  width:100%; min-height:120px; background:var(--card2); border:1px solid var(--border); border-radius:9px;
  color:var(--text); font-size:12px; padding:10px; font-family:ui-monospace,Menlo,monospace;
}
.small-link{ color:var(--blue); font-size:13px; font-weight:600; margin-top:4px; display:inline-block; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--text-dim); }
.empty-state b{ display:block; color:var(--text); font-size:16px; margin-bottom:6px; }

/* ---------- Tab switcher ---------- */
.tabbar{ display:flex; gap:4px; padding:4px; margin:10px 16px 0; max-width:640px; margin-left:auto; margin-right:auto;
  background:var(--card2); border:1px solid var(--border); border-radius:12px; }
.tabbar button{ flex:1; padding:9px 0; border:none; background:transparent; color:var(--text-dim);
  font-size:13.5px; font-weight:700; border-radius:9px; font-family:inherit; }
.tabbar button.active{ background:var(--accent); color:#171208; }

/* ---------- Calculator-style keypad (used inside a modal) ---------- */
.calc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
.calc-key{ background:var(--card2); border:1px solid var(--border); color:var(--text);
  font-size:21px; font-family:ui-monospace,Menlo,monospace; border-radius:11px; padding:15px 0; font-weight:600; }
.calc-key:active{ background:var(--accent-dim); }
.calc-key.fn{ color:var(--text-dim); font-size:17px; }
.calc-display{ font-family:ui-monospace,Menlo,monospace; font-size:34px; font-weight:700; text-align:center;
  padding:12px 0 16px; color:var(--accent); border-bottom:1px solid var(--border); margin-bottom:14px; }
input.calc-trigger{ cursor:pointer; caret-color:transparent; }
input.calc-trigger:active{ background:var(--accent-dim) !important; }

/* ---------- Investments tab ---------- */
.invest-card{ background:linear-gradient(155deg,var(--card2),var(--card)); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:16px; }
.invest-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font-size:13px; color:var(--text-dim); }
.invest-row:last-child{ margin-bottom:0; }
.invest-row b{ color:var(--text); font-size:14px; }
.invest-hero{ margin-bottom:12px; }
.invest-hero .l{ font-size:12.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
.invest-hero .v{ font-size:28px; font-weight:800; margin-top:4px; color:var(--good); }
.invest-hero .v.neg{ color:var(--warn); }
.cat-card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.cat-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.cat-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.cat-name{ font-size:15px; font-weight:700; flex:1; }
.cat-pct{ font-size:12px; font-weight:800; padding:3px 8px; border-radius:6px; font-family:ui-monospace,Menlo,monospace; }
.progress-track{ height:7px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:12px; }
.progress-fill{ height:100%; border-radius:4px; }
.cat-fields{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.cat-fields .field label{ font-size:9.5px; }
.cat-fields .field input, .cat-fields .cat-current{
  background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:8px;
  font-size:13.5px; font-family:ui-monospace,Menlo,monospace; width:100%; color:var(--text); }
.cat-current{ color:var(--text-dim); display:flex; align-items:center; }
.cat-fields.single{ grid-template-columns:1fr; }
.cat-total{ color:var(--good); font-weight:700; display:flex; align-items:center; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Saferoad Lön</h1>
  <div class="sub" id="topSub">Offline salary &amp; timesheet</div>
</div>

<div class="months-row" id="monthsRow"></div>

<div class="tabbar">
  <button id="tabBtnLon">Lön</button>
  <button id="tabBtnInvest">Investments</button>
  <button id="tabBtnPortfolio">Portfolio</button>
  <button id="tabBtnGraph">Graph</button>
</div>

<div class="container" id="mainContainer"></div>

<div class="bottom-actions">
  <button class="btn btn-secondary" id="dataBtn">Data</button>
  <button class="btn btn-secondary" id="deleteMonthBtn">Delete month</button>
  <button class="btn btn-primary" id="addMonthBtn">+ New month</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

function lookupTax(totalEarned) {
  if (!(totalEarned > 0)) return 0;
  // rightmost bracket whose lower bound <= totalEarned
  let lo = 0, hi = TAX_TABLE.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (TAX_TABLE[mid][0] <= totalEarned) { ans = TAX_TABLE[mid][1]; lo = mid + 1; }
    else hi = mid - 1;
  }
  return ans;
}

/* ---------- Time helpers ----------
   Times are stored as "HH:MM" strings. We compute everything in
   minutes, with dayOffset*1440 as the date component, exactly
   mirroring the spreadsheet's datetime arithmetic. */
function hhmmToMin(s) {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}

/* weekday#: Mon=1 ... Sun=7 (ISO), matching Excel WEEKDAY(date,2) */
function isoWeekday(dateObj) {
  const d = dateObj.getDay(); // 0=Sun..6=Sat
  return d === 0 ? 7 : d;
}

/* ---------- Core per-day calculation ----------
   entry: { dateStr:'YYYY-MM-DD', start, stop, lunchStart, lunchDur,
            sparbevakare:bool, holiday:bool, notes:'' }
   Returns an object with every intermediate figure (mirrors the
   workbook's helper columns) plus the final totals. */
function overlapMin(aStart, aEnd, bStart, bEnd) {
  return Math.max(0, Math.min(aEnd, bEnd) - Math.max(aStart, bStart));
}

function computeDay(entry, dayOffset) {
  const date = new Date(entry.dateStr + 'T00:00:00');
  const O = isoWeekday(date); // 1..7

  const base = dayOffset * 1440;
  const C = hhmmToMin(entry.start);
  const D = hhmmToMin(entry.stop);
  const N = (entry.start && entry.stop) ? true : false;

  if (!N) {
    return {
      hasData: false, weekday: O, isWeekendOrHoliday: false,
      hoursWorked: 0, overtimeHours: 0, dayRate: 0,
      baseHrs: 0, eveningHrs: 0, nightHrs: 0,
      weekdayOtHrs: 0, weekendHrs: 0, weekendOtHrs: 0,
      sparbevakareAdd: 0, km: entry.km ? Number(entry.km) : 0,
      carAllowance: (entry.km ? Number(entry.km) : 0) * RATE_KM,
      akassaHours: entry.akassaHours ? Number(entry.akassaHours) : 0,
      akassaPay: (entry.akassaHours ? Number(entry.akassaHours) : 0) * RATE_AKASSA
    };
  }

  const P = base + C;
  const Q = base + D + (D <= C ? 1440 : 0);

  const hasLunch = entry.lunchStart && entry.lunchDur;
  const E = hhmmToMin(entry.lunchStart);
  const F = entry.lunchDur ? Number(entry.lunchDur) : null;

  const R = hasLunch ? (base + E) : Q;
  const S = hasLunch ? (R + F) : Q;

  const T = (R - P) / 60;   // pre-lunch hrs
  const U = (Q - S) / 60;   // post-lunch hrs
  const V = T + U;          // total worked hrs

  const isHoliday = !!entry.holiday;
  const isNaturalWeekend =
    (O === 5 && C >= 19 * 60) ||
    O === 6 || O === 7 ||
    (O === 1 && C < 5 * 60);
  const W = isNaturalWeekend || isHoliday;

  const X = Math.min(V, 8);          // regular hrs (<=8, whole shift)
  const Y = Math.max(V - 8, 0);      // overtime hrs (whole shift)

  // Z = clock-time (abs minutes) where the shift's cumulative 8 regular
  // hours run out and overtime begins — same for every branch below.
  let Z;
  if (T >= 8) Z = P + 8 * 60;
  else if (V >= 8) Z = S + (8 - T) * 60;
  else Z = Q;

  const AA = Math.min(R, Z);                  // end of "regular" within seg1 (pre-lunch)
  const AB = Math.max(S, Math.min(Z, Q));      // end of "regular" within seg2 (post-lunch)

  let AN = 0, AK = 0, AL = 0, AO = 0, AP = 0, AQ = 0;

  if (isNaturalWeekend) {
    // Weekend/holiday rate (379/402) applies only from the shift's start
    // up to Monday 05:00 (WE below). Anything past that point falls back
    // to ordinary weekday rules — including the 05:00-06:00 "evening"
    // exception — for whichever hours spill past the boundary.
    const daysUntilMonday = { 5: 3, 6: 2, 7: 1, 1: 0 }[O];
    const WE = base + daysUntilMonday * 1440 + 5 * 60;

    const weekendRegHrs = (overlapMin(P, AA, P, WE) + overlapMin(S, AB, P, WE)) / 60;
    const weekendOtHrs = (overlapMin(AA, R, AA, WE) + overlapMin(AB, Q, AB, WE)) / 60;
    const postRegHrs = X - weekendRegHrs;
    const postOtHrs = Y - weekendOtHrs;

    AP = weekendRegHrs;
    AQ = weekendOtHrs;
    AO = postOtHrs;

    if (postRegHrs > 0) {
      // Monday-relative windows, anchored off WE (= Monday 05:00)
      const monEarlyStart = WE, monEarlyEnd = WE + 60;
      const monBaseStart = WE + 60, monBaseEnd = WE + 12.5 * 60;
      const monEveningStart = monBaseEnd, monEveningEnd = WE + 17 * 60;
      const monNightStart = monEveningEnd, monNightEnd = WE + 24 * 60 + 5 * 60;

      const postSeg1Start = Math.max(P, WE), postSeg1End = Math.max(AA, WE);
      const postSeg2Start = Math.max(S, WE), postSeg2End = Math.max(AB, WE);

      const mBase = (overlapMin(postSeg1Start, postSeg1End, monBaseStart, monBaseEnd) +
                     overlapMin(postSeg2Start, postSeg2End, monBaseStart, monBaseEnd)) / 60;
      const mEarly = (overlapMin(postSeg1Start, postSeg1End, monEarlyStart, monEarlyEnd) +
                      overlapMin(postSeg2Start, postSeg2End, monEarlyStart, monEarlyEnd)) / 60;
      const mEvening = (overlapMin(postSeg1Start, postSeg1End, monEveningStart, monEveningEnd) +
                        overlapMin(postSeg2Start, postSeg2End, monEveningStart, monEveningEnd)) / 60;
      const mNight = (overlapMin(postSeg1Start, postSeg1End, monNightStart, monNightEnd) +
                      overlapMin(postSeg2Start, postSeg2End, monNightStart, monNightEnd)) / 60;
      const mGap = Math.max(0, postRegHrs - (mBase + mEarly + mEvening + mNight));

      AN = mBase + mGap;
      AK = mEarly + mEvening;
      AL = mNight;
    }
  } else if (isHoliday) {
    // Whole flagged day stays at the weekend/holiday rate, uncapped.
    AP = X;
    AQ = Y;
  } else {
    // Ordinary weekday shift.
    const AC = base + 6 * 60;
    const AD = base + 17.5 * 60;
    const AE = base + (O === 5 ? 19 * 60 : 22 * 60);
    const AF = base + 22 * 60;
    const AG = base + 1440 + 5 * 60;
    const earlyStart = base + 5 * 60, earlyEnd = base + 6 * 60; // 05:00-06:00 -> evening rate

    const AH = O <= 5 ? 1 : 0;
    const AI = O <= 4 ? 1 : 0;

    const AJ = AH * ((overlapMin(P, AA, AC, AD) + overlapMin(S, AB, AC, AD)) / 60);
    const AKmain = AH * ((overlapMin(P, AA, AD, AE) + overlapMin(S, AB, AD, AE)) / 60);
    const AKearly = AH * ((overlapMin(P, AA, earlyStart, earlyEnd) + overlapMin(S, AB, earlyStart, earlyEnd)) / 60);
    AL = AI * ((overlapMin(P, AA, AF, AG) + overlapMin(S, AB, AF, AG)) / 60);

    const AM = Math.max(0, X - (AJ + AKmain + AKearly + AL));
    AN = AJ + AM;
    AK = AKmain + AKearly;
    AO = Y;
  }

  const AR = AN * RATE_BASE + AK * RATE_EVENING + AL * RATE_NIGHT + AO * RATE_WEEKDAY_OT;
  const AS = AP * RATE_WEEKEND + AQ * RATE_WEEKEND_OT;

  const AT = entry.sparbevakare ? 1 : 0;
  const AU = AT * V * RATE_SPARBEVAKARE;
  const AV = AR + AS + AU;

  // Tax-free car mileage allowance — independent of worked hours/rates
  const km = entry.km ? Number(entry.km) : 0;
  const carAllowance = km * RATE_KM;

  // A-Kassa — also independent of worked hours/rates, already after tax
  const akassaHours = entry.akassaHours ? Number(entry.akassaHours) : 0;
  const akassaPay = akassaHours * RATE_AKASSA;

  return {
    hasData: true, weekday: O, isWeekendOrHoliday: W,
    hoursWorked: V,
    overtimeHours: Y,
    dayRate: AV,
    baseHrs: AN, eveningHrs: AK, nightHrs: AL,
    weekdayOtHrs: AO, weekendHrs: AP, weekendOtHrs: AQ,
    sparbevakareAdd: AU,
    km, carAllowance,
    akassaHours, akassaPay
  };
}

/* ---------- Month utilities ---------- */
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); } // month:1-12
const DOW_ABBR = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthKey(year, month) { return `${year}-${String(month).padStart(2,'0')}`; }

function buildEmptyMonth(year, month) {
  const n = daysInMonth(year, month);
  const days = [];
  for (let d = 1; d <= n; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    days.push({ dateStr, start:'', stop:'', lunchStart:'', lunchDur:'', sparbevakare:false, holiday:false, km:'', akassaHours:'', notes:'' });
  }
  return { year, month, days };
}

// These categories get a fresh, manually-entered Value each month
// (the actual account balance at the start of that month) instead of one
// fixed value shared across every month.
const PORTFOLIO_MONTHLY_KEYS = ['lysa', 'avanzaGlobal', 'sparkonto', 'stocks'];

/* Make sure a month has a Value entry for the monthly-tracked categories,
   carrying forward the closest earlier month's values as a starting point
   so there's something sensible to adjust rather than starting blank. */
function ensurePortfolioMonthValues(key) {
  if (!state.portfolio.monthlyValues) state.portfolio.monthlyValues = {};
  if (state.portfolio.monthlyValues[key]) return;
  const priorKeys = Object.keys(state.portfolio.monthlyValues).filter(k => k < key).sort();
  const priorKey = priorKeys[priorKeys.length - 1];
  const prior = priorKey ? state.portfolio.monthlyValues[priorKey] : {};
  const carried = {};
  PORTFOLIO_MONTHLY_KEYS.forEach(k => {
    carried[k] = (prior && prior[k] != null) ? prior[k] : (k === 'stocks' && state.portfolio.stocks != null ? state.portfolio.stocks : '');
  });
  state.portfolio.monthlyValues[key] = carried;
}

/* Resolve the Value shown/edited for a category in a given month: the
   monthly-tracked categories (including Stocks) read/write per-month
   storage, the rest keep the single shared value they always had. */
function portfolioValueFor(catKey, key) {
  if (PORTFOLIO_MONTHLY_KEYS.includes(catKey)) {
    const mv = state.portfolio.monthlyValues[key];
    return mv && mv[catKey] != null ? mv[catKey] : '';
  }
  return state.portfolio.values[catKey] != null ? state.portfolio.values[catKey] : '';
}

/* ---------- Stock holdings: priced by the Worker's nightly cache ---------- */
let lastStockFetchError = '';
let autoRefreshAttempted = false;
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Prices now come from your Cloudflare Worker's own KV cache, populated by
// a nightly cron job on the Worker (once per day, previous close only —
// never after-hours/overnight prices), not from a live Finnhub call
// triggered by this app. That means checking here is just a fast read with
// no rate-limit risk at all, however often it's called. Registering the
// current ticker list also makes the Worker fetch any brand-new ticker
// once immediately, so it's not stuck blank until the next nightly run.
async function refreshStockPricesIfNeeded(force) {
  lastStockFetchError = '';
  const holdings = state.portfolio.stockHoldings || [];
  if (holdings.length === 0) { lastStockFetchError = 'No holdings added yet.'; return false; }
  const today = todayStr();
  if (!force && state.portfolio.stocksCache.date === today) return false;
  const tickers = [...new Set(holdings.map(h => (h.ticker || '').trim().toUpperCase()).filter(Boolean))];
  if (tickers.length === 0) { lastStockFetchError = 'No ticker symbols entered.'; return false; }
  const WORKER = 'https://finnhub-proxy.dawg0222.workers.dev';
  try {
    // Keep the Worker's watchlist in sync + trigger an immediate fetch for
    // any ticker it hasn't seen before. Best-effort: if this fails, we can
    // still read whatever's already cached below.
    try {
      await fetch(`${WORKER}/register-tickers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tickers }),
        cache: 'no-store',
      });
    } catch (regErr) { /* non-fatal — proceed to read whatever's cached */ }

    const pricesRes = await fetch(`${WORKER}/prices?tickers=${encodeURIComponent(tickers.join(','))}&_=${Date.now()}`, { cache: 'no-store' });
    if (!pricesRes.ok) throw new Error(`Price lookup failed: HTTP ${pricesRes.status} (Worker may be temporarily unavailable).`);
    const pricesData = await pricesRes.json();
    const cachedPrices = (pricesData && pricesData.prices) || {};
    const prices = {};
    const missing = [];
    tickers.forEach(t => {
      if (cachedPrices[t] && cachedPrices[t].price) prices[t] = cachedPrices[t].price;
      else missing.push(t);
    });
    if (Object.keys(prices).length === 0) {
      throw new Error(`No prices cached yet for: ${missing.join(', ')} — check the ticker symbol, or it may just need tonight's scheduled update to run once.`);
    }

    // FX rate — routed through the Worker's generic proxy too, since
    // Frankfurter's endpoint issues a redirect missing a CORS header that
    // blocks a direct browser fetch() outright.
    const fxTarget = `https://api.frankfurter.app/latest?from=USD&to=SEK`;
    const fxRes = await fetch(`${WORKER}/?url=${encodeURIComponent(fxTarget)}&_=${Date.now()}`, { cache: 'no-store' });
    if (!fxRes.ok) throw new Error(`Exchange-rate lookup failed (HTTP ${fxRes.status}).`);
    const fxData = await fxRes.json();
    const fx = (fxData && fxData.rates && fxData.rates.SEK) || (state.portfolio.stocksCache.fx || null);

    state.portfolio.stocksCache = { date: today, fx, prices };
    saveData();
    if (missing.length > 0) {
      lastStockFetchError = `Not priced yet: ${missing.join(', ')} — will populate after tonight's scheduled update.`;
    }
    return true;
  } catch (e) {
    lastStockFetchError = (e && e.message) ? e.message : 'Could not fetch prices — check your internet connection and try again.';
    return false;
  }
}

// Sums shares × cached price across all holdings, converted to SEK using
// the cached FX rate. Also applies the broker's currency-conversion fee
// (state.portfolio.brokerFeePct) to give a realistic "if I sold and
// withdrew today" figure alongside the raw market value. Uses whatever's
// cached — doesn't fetch.
function stockHoldingsTotals() {
  const cache = state.portfolio.stocksCache || {};
  const prices = cache.prices || {};
  const fx = Number(cache.fx) || 0;
  let totalUsd = 0;
  (state.portfolio.stockHoldings || []).forEach(h => {
    const t = (h.ticker || '').trim().toUpperCase();
    const shares = Number(h.shares) || 0;
    const price = Number(prices[t]) || 0;
    totalUsd += shares * price;
  });
  const totalSek = totalUsd * fx;
  const feePct = Number(state.portfolio.brokerFeePct);
  const feePctSafe = isNaN(feePct) ? 0.25 : feePct;
  const totalSekAfterFee = totalSek * (1 - feePctSafe / 100);
  return { totalUsd, fx, totalSek, feePct: feePctSafe, totalSekAfterFee };
}

/* Cumulative amount actually added to a category via "Add now" — this
   drives the Target progress bar. */
function cumulativeContribution(catKey, uptoKey) {
  // "This month" now resets to 0 each time "Add now" is clicked (the money
  // moves into Portfolio's Value instead), so summing the monthly entries
  // directly would lose history the moment a month gets claimed. Target
  // progress instead tracks off the permanent running total recorded at
  // each "Add now" click — see state.investments.contributed.
  return totalContribution(catKey);
}

/* All-time total actually added to a category via "Add now" in the
   Investing tab — what Target progress is measured against. Recorded
   permanently at click time, independent of "This month" (which resets
   to 0 right after). */
function totalContribution(catKey) {
  return Number(state.investments.contributed && state.investments.contributed[catKey]) || 0;
}

function fmtSEK(n) {
  return (Math.round(n*100)/100).toLocaleString('sv-SE', {minimumFractionDigits:0, maximumFractionDigits:0}) + ' kr';
}
function fmtHrs(n) {
  const r = Math.round(n*100)/100;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(2)) + ' h';
}

function computeMonthTotals(monthData) {
  const computed = monthData.days.map((entry, i) => computeDay(entry, i));
  let totalHours=0, totalOT=0, totalEarned=0, totalKm=0, totalCarAllowance=0, totalAkassaHours=0, totalAkassaPay=0;
  let sumBase=0, sumEvening=0, sumNight=0, sumWeekdayOT=0, sumWeekend=0, sumWeekendOT=0, sumSpar=0;
  computed.forEach(c => {
    totalHours += c.hoursWorked;
    totalOT += c.overtimeHours;
    totalEarned += c.dayRate;
    totalKm += c.km;
    totalCarAllowance += c.carAllowance;
    totalAkassaHours += c.akassaHours;
    totalAkassaPay += c.akassaPay;
    sumBase += c.baseHrs; sumEvening += c.eveningHrs; sumNight += c.nightHrs;
    sumWeekdayOT += c.weekdayOtHrs; sumWeekend += c.weekendHrs; sumWeekendOT += c.weekendOtHrs;
    sumSpar += c.sparbevakareAdd;
  });
  const tax = lookupTax(totalEarned);
  const netto = totalEarned > 0 ? (totalEarned - tax) : 0;
  const payout = netto + totalCarAllowance + totalAkassaPay;
  return { computed, totalHours, totalOT, totalEarned, totalKm, totalCarAllowance, totalAkassaHours, totalAkassaPay,
           sumBase, sumEvening, sumNight, sumWeekdayOT, sumWeekend, sumWeekendOT, sumSpar,
           tax, netto, payout };
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    btn.addEventListener('click', () => {
      const catKey = btn.dataset.cat;
      const amt = Number(state.investments.monthly[key] && state.investments.monthly[key][catKey]) || 0;
      if (amt <= 0) return;
      // Move the amount into Portfolio's tracked Value for this category —
      // since there's no live bank connection, this is the app's best
      // approximation of "the transfer happened"; Value stays editable so
      // it can still be corrected against the real account balance anytime.
      const currentVal = Number(portfolioValueFor(catKey, key)) || 0;

        state.portfolio.monthlyValues[key][catKey] = newVal;
      } else {
        state.portfolio.values[catKey] = newVal;
      }
      // Permanent record for Target progress (survives "This month" resets)
      state.investments.contributed[catKey] = (Number(state.investments.contributed[catKey]) || 0) + amt;
      state.investments.lastAdded[catKey] = key;
      // Reset "This month" now that it's been added
      state.investments.monthly[key] = state.investments.monthly[key] || {};
      state.investments.monthly[key][catKey] = 0;
      saveData();
      render();
    });
  });
}

function renderPortfolio() {
  mainContainer.innerHTML = '';
  topSub.textContent = 'Portfolio';

  // Kicks off a price refresh in the background if today's isn't cached yet
  // (no-ops instantly otherwise). Re-renders once new prices — or an
  // error — land. Only auto-attempted once per page load so a failure
  // doesn't retry silently on every re-render.
  if (!autoRefreshAttempted) {
    autoRefreshAttempted = true;
    refreshStockPricesIfNeeded().then(updated => { if (updated || lastStockFetchError) render(); });
  }

  const key = state.activeMonth;
  ensurePortfolioMonthValues(key);

  const stocksVal = Number(portfolioValueFor('stocks', key)) || 0;

  let grandTotal = stocksVal;
  let grandTotalAtTarget = stocksVal;
  const rows = CATEGORIES.map(cat => {
    const value = Number(portfolioValueFor(cat.key, key)) || 0;
    // Total now equals Value directly — "Add now" in the Investing tab
    // already folds each month's contribution into Value at the moment
    // it's confirmed, so there's no separate pending amount to project
    // on top of it anymore.
    const total = value;
    const cumulative = totalContribution(cat.key);
    const t = state.investments.targets[cat.key] || {};
    const target = Number(t.target) || 0;
    // If a target is set, project this category at whichever is higher —
    // the target itself, or what's already been put in (never project down).
    const totalAtTarget = value + (target > 0 ? Math.max(target, cumulative) : cumulative);
    grandTotal += total;
    grandTotalAtTarget += totalAtTarget;
    const lastAddedKey = state.investments.lastAdded[cat.key];
    return { cat, value, cumulative, total, target, totalAtTarget, lastAddedKey };
  });

  const cashTotal = rows.filter(r => CASH_KEYS.includes(r.cat.key)).reduce((s, r) => s + r.total, 0);
  const stocksIndexTotal = rows.filter(r => STOCK_KEYS.includes(r.cat.key)).reduce((s, r) => s + r.total, 0) + stocksVal;
  const resaRow = rows.find(r => r.cat.key === 'resa') || { total: 0, totalAtTarget: 0 };
  const resaTotal = resaRow.total;
  const netExclResa = grandTotal - resaTotal;

  // Apartment sale proceeds — only the distributed portions count, and only
  // toward the "if target is met" figures (Cash, Stocks/Index, and the top total).
  const apt = state.portfolio.apartmentSale || {};
  const aptToCash = Number(apt.toCash) || 0;
  const aptToIndex = Number(apt.toIndex) || 0;

  const cashAtTarget = rows.filter(r => CASH_KEYS.includes(r.cat.key)).reduce((s, r) => s + r.totalAtTarget, 0) + aptToCash;
  const stocksIndexAtTarget = rows.filter(r => STOCK_KEYS.includes(r.cat.key)).reduce((s, r) => s + r.totalAtTarget, 0) + stocksVal + aptToIndex;
  const totalAtTargetExclResa = (grandTotalAtTarget - resaRow.totalAtTarget) + aptToCash + aptToIndex;

  // How much more still needs to be invested (contributed) to reach every
  // target, excluding Resa — i.e. sum of each category's remaining gap.
  const remainingToTargets = rows
    .filter(r => r.cat.key !== 'resa' && r.target > 0)

  const summary = document.createElement('div');
  summary.className = 'summary-card';
  summary.innerHTML = `

    </div>
    <div class="summary-grid">

/* ---------- Graph tab: category values over time ---------- */
/* Renders a multi-line SVG chart (grid, lines, dots, x-axis labels) for a
   given set of {name, color, points} series against the shared month keys.
   Kept separate from data-building so both the per-category and total
   charts can reuse the same drawing logic with their own value scale. */
function buildLineChartSVG(seriesArr, keys) {
  const allVals = seriesArr.flatMap(d => d.points);
  const maxVal = Math.max(1, ...allVals);
  const minVal = Math.min(0, ...allVals);

  const W = 800, H = 380;
  const padL = 55, padR = 16, padT = 16, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const xFor = (i) => keys.length === 1 ? padL + plotW / 2 : padL + (i / (keys.length - 1)) * plotW;
  const yFor = (v) => padT + plotH - ((v - minVal) / ((maxVal - minVal) || 1)) * plotH;

  const gridCount = 4;
  let gridLines = '';
  for (let g = 0; g <= gridCount; g++) {
    const v = minVal + (maxVal - minVal) * (g / gridCount);
    const y = yFor(v);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2c3140" stroke-width="1"/>`;
    gridLines += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#9aa1b3">${Math.round(v / 1000)}k</text>`;
  }

  let xLabels = '';
  keys.forEach((mk, i) => {
    const [y, m] = mk.split('-').map(Number);
    // Thin labels out if there are many months, keeping first/last.
    const step = Math.ceil(keys.length / 8);
    if (keys.length <= 8 || i % step === 0 || i === keys.length - 1) {
      const x = xFor(i);
      xLabels += `<text x="${x}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="#9aa1b3">${MONTH_NAMES[m - 1].slice(0, 3)} ${String(y).slice(2)}</text>`;
    }
  });

  let lines = '';
  let dots = '';
  seriesArr.forEach(d => {
    const pathD = d.points.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(v)}`).join(' ');
    lines += `<path d="${pathD}" fill="none" stroke="${d.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    d.points.forEach((v, i) => {
      dots += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${d.color}"/>`;
    });
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${gridLines}
      ${lines}
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function renderGraph() {
  mainContainer.innerHTML = '';
  topSub.textContent = 'Portfolio — Graph';

  const keys = sortedMonthKeys();

  if (keys.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'rates-note';
    empty.textContent = 'Add at least one month to see a graph.';
    mainContainer.appendChild(empty);
    return;
  }

  // Same set of categories as the Portfolio tab, plus Stocks. Each point is
  // that category's Total for the month (Value + that month's contribution;
  // Stocks has no contribution, so it's Value only).
  const series = [
    { key: 'lysa', name: 'LYSA', color: '#5b8cff' },
    { key: 'avanzaGlobal', name: 'Avanza Global Index', color: '#4cc38a' },
    { key: 'sparkonto', name: 'Sparkonto', color: '#f5a623' },
    { key: 'resa', name: 'Resa', color: '#3fa7a0' },
    { key: 'buffert', name: 'Buffert', color: '#ef6a6a' },
    { key: 'stocks', name: 'Stocks', color: '#a78bfa' },
  ];

  const data = series.map(s => {
    const points = keys.map(mk => {
      const value = Number(portfolioValueFor(s.key, mk)) || 0;
      const monthlyContrib = (state.investments.monthly && state.investments.monthly[mk]) || {};
      const contrib = s.key === 'stocks' ? 0 : (Number(monthlyContrib[s.key]) || 0);
      return value + contrib;
    });
    return Object.assign({}, s, { points });
  });

  const card = document.createElement('div');
  card.className = 'summary-card';
  card.innerHTML = `<div class="section-title" style="margin:0 0 12px;">Portfolio value over time</div>${buildLineChartSVG(data, keys)}`;
  mainContainer.appendChild(card);

  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;';
  legend.innerHTML = data.map(d => `
    <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#9aa1b3;">
      <span style="width:10px;height:10px;border-radius:50%;background:${d.color};display:inline-block;"></span>
      ${d.name}
    </div>
  `).join('');
  mainContainer.appendChild(legend);

  const note = document.createElement('div');
  note.className = 'rates-note';
  note.textContent = "Each point is that category's Total for the month (Value + that month's contribution). Stocks has no monthly contribution, so its line is Value only.";
  mainContainer.appendChild(note);

  // Second chart: the combined total across every category, so the overall
  // change in portfolio value over time is visible on its own.
  const totalPoints = keys.map((mk, i) => data.reduce((s, d) => s + d.points[i], 0));
  const totalSeries = [{ name: 'Total portfolio value', color: '#4cc38a', points: totalPoints }];
  const firstTotal = totalPoints[0];
  const lastTotal = totalPoints[totalPoints.length - 1];
  const netChange = lastTotal - firstTotal;
  const changeColor = netChange >= 0 ? '#4cc38a' : '#ef6a6a';
  const changeSign = netChange >= 0 ? '+' : '';

  const totalTitleRow = document.createElement('div');
  totalTitleRow.style.cssText = 'display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px;flex-wrap:wrap;';
  totalTitleRow.innerHTML = `
    <div class="section-title" style="margin:0;">Total portfolio value over time</div>
    ${keys.length > 1 ? `<div style="font-size:12.5px;color:${changeColor};font-weight:600;">${changeSign}${fmtSEK(netChange)} since ${MONTH_NAMES[Number(keys[0].split('-')[1])-1].slice(0,3)} ${keys[0].split('-')[0]}</div>` : ''}
  `;

  const totalCard = document.createElement('div');
  totalCard.className = 'summary-card';
  totalCard.appendChild(totalTitleRow);
  const totalSvgWrap = document.createElement('div');
  totalSvgWrap.innerHTML = buildLineChartSVG(totalSeries, keys);
  totalCard.appendChild(totalSvgWrap);
  mainContainer.appendChild(totalCard);

  const totalNote = document.createElement('div');
  totalNote.className = 'rates-note';
  totalNote.textContent = 'The combined value of every category above (LYSA, Avanza Global Index, Sparkonto, Resa, Buffert and Stocks) for each month.';
  mainContainer.appendChild(totalNote);
}

function render() {
  renderMonthsRow();
  document.getElementById('tabBtnLon').classList.toggle('active', state.activeTab === 'lon');
  document.getElementById('tabBtnInvest').classList.toggle('active', state.activeTab === 'invest');
  document.getElementById('tabBtnPortfolio').classList.toggle('active', state.activeTab === 'portfolio');
  document.getElementById('tabBtnGraph').classList.toggle('active', state.activeTab === 'graph');
  if (state.activeTab === 'invest') renderInvest();
  else if (state.activeTab === 'portfolio') renderPortfolio();
  else if (state.activeTab === 'graph') renderGraph();
  else renderMain();
}
document.getElementById('tabBtnLon').addEventListener('click', () => { state.activeTab = 'lon'; saveData(); render(); });
document.getElementById('tabBtnInvest').addEventListener('click', () => { state.activeTab = 'invest'; saveData(); render(); });
document.getElementById('tabBtnPortfolio').addEventListener('click', () => { state.activeTab = 'portfolio'; saveData(); render(); });
document.getElementById('tabBtnGraph').addEventListener('click', () => { state.activeTab = 'graph'; saveData(); render(); });


function attachDayListeners() {
  mainContainer.querySelectorAll('.day-head').forEach(h => {
    h.addEventListener('click', () => {
      const idx = Number(h.dataset.idx);
      openDayIndex = (openDayIndex === idx) ? null : idx;
      render();
    });
  });
  mainContainer.querySelectorAll('[data-field]').forEach(inp => {
    if (inp.classList.contains('calc-trigger')) {
      inp.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.field;
        const key = state.activeMonth;
        const currentVal = state.months[key].days[idx][field] || '';
        if (field === 'km') {
          openNumberCalculator('Car km driven', 'km', currentVal, (val) => {
            state.months[key].days[idx][field] = val;
            saveData();
            render();
          });
        } else {
          const labels = { start: 'Start', stop: 'Stop', lunchStart: 'Lunch start' };
          openTimeCalculator(idx, field, labels[field] || field, currentVal);
        }
      });
      return;
    }
    const evt = (inp.type === 'checkbox') ? 'change' : 'input';
    inp.addEventListener(evt, (e) => {
      e.stopPropagation();
      const idx = Number(inp.dataset.idx);
      const field = inp.dataset.field;
      const key = state.activeMonth;
      const entry = state.months[key].days[idx];
      if (inp.type === 'checkbox') entry[field] = inp.checked;
      else entry[field] = inp.value;
      saveData();
      render();
      // restore focus/caret for text-ish inputs after re-render
      if (inp.type !== 'checkbox') {
        requestAnimationFrame(() => {
          const again = mainContainer.querySelector(`[data-field="${field}"][data-idx="${idx}"]`);
          if (again) { again.focus(); }
        });
      }
    });
    inp.addEventListener('click', (e) => e.stopPropagation());
  });
  mainContainer.querySelectorAll('.clear-day').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = Number(btn.dataset.idx);
      const key = state.activeMonth;
      const dateStr = state.months[key].days[idx].dateStr;
      state.months[key].days[idx] = { dateStr, start:'', stop:'', lunchStart:'', lunchDur:'', sparbevakare:false, holiday:false, km:'', akassaHours:'', notes:'' };
      saveData();
      render();
    });
  });
}

/* ---------- Modals ---------- */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalContent = document.getElementById('modalContent');
function openModal(html) { modalContent.innerHTML = html; modalBackdrop.classList.add('show'); }
function closeModal() { modalBackdrop.classList.remove('show'); modalContent.innerHTML=''; }
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

/* Calculator-style time entry: digits shift in from the right, like a
   phone-number field — type "630" and it resolves to 06:30. */
function openTimeCalculator(idx, field, label, currentVal) {
  let raw = '';
  let fresh = true;

  const displayText = () => {
    if (fresh) return currentVal || '--:--';
    const windowed = raw.slice(-4).padStart(4, '0');
    return windowed.slice(0, 2) + ':' + windowed.slice(2, 4);
  };

  openModal(`
    <h3>${label}</h3>
    <div class="calc-display" id="calcDisplay">${displayText()}</div>
    <div class="calc-grid">
      <button type="button" class="calc-key" data-k="7">7</button>
      <button type="button" class="calc-key" data-k="8">8</button>
      <button type="button" class="calc-key" data-k="9">9</button>
      <button type="button" class="calc-key" data-k="4">4</button>
      <button type="button" class="calc-key" data-k="5">5</button>
      <button type="button" class="calc-key" data-k="6">6</button>
      <button type="button" class="calc-key" data-k="1">1</button>
      <button type="button" class="calc-key" data-k="2">2</button>
      <button type="button" class="calc-key" data-k="3">3</button>
      <button type="button" class="calc-key fn" data-k="clear">C</button>
      <button type="button" class="calc-key" data-k="0">0</button>
      <button type="button" class="calc-key fn" data-k="back">⌫</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="calcCancel">Cancel</button>
      <button class="btn btn-primary" id="calcDone">Done</button>
    </div>
  `);

  const disp = document.getElementById('calcDisplay');
  modalContent.querySelectorAll('.calc-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k;
      if (k === 'clear') { raw = ''; fresh = false; }
      else if (k === 'back') { fresh = false; raw = raw.slice(0, -1); }
      else { fresh = false; raw += k; }
      disp.textContent = displayText();
    });
  });
  document.getElementById('calcCancel').onclick = closeModal;
  document.getElementById('calcDone').onclick = () => {
    let result;
    if (fresh) {
      result = currentVal || '';
    } else if (raw === '') {
      result = '';
    } else {
      const windowed = raw.slice(-4).padStart(4, '0');
      const hh = Math.min(Math.max(parseInt(windowed.slice(0, 2), 10) || 0, 0), 23);
      const mm = Math.min(Math.max(parseInt(windowed.slice(2, 4), 10) || 0, 0), 59);
      result = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }
    const key = state.activeMonth;
    state.months[key].days[idx][field] = result;
    saveData();
    closeModal();
    render();
  };
}

/* Calculator-style plain-number entry (used for km, and Investments'
   "This month" / "Target"). Accumulates digits left-to-right with an
   optional decimal point; first keypress replaces the existing value. */
function openNumberCalculator(label, unit, currentVal, onConfirm) {
  let raw = '';
  let fresh = true;
  const displayText = () => fresh
    ? (currentVal !== undefined && currentVal !== null && currentVal !== '' ? String(currentVal) : '0')
    : (raw === '' ? '0' : raw);
  const unitHtml = unit ? `<span style="font-size:16px;color:var(--text-dim);margin-left:4px;">${unit}</span>` : '';

  openModal(`
    <h3>${label}</h3>
    <div class="calc-display" id="calcDisplay">${displayText()}${unitHtml}</div>
    <div class="calc-grid">
      <button type="button" class="calc-key" data-k="7">7</button>
      <button type="button" class="calc-key" data-k="8">8</button>
      <button type="button" class="calc-key" data-k="9">9</button>
      <button type="button" class="calc-key" data-k="4">4</button>
      <button type="button" class="calc-key" data-k="5">5</button>
      <button type="button" class="calc-key" data-k="6">6</button>
      <button type="button" class="calc-key" data-k="1">1</button>
      <button type="button" class="calc-key" data-k="2">2</button>
      <button type="button" class="calc-key" data-k="3">3</button>
      <button type="button" class="calc-key fn" data-k=".">.</button>
      <button type="button" class="calc-key" data-k="0">0</button>
      <button type="button" class="calc-key fn" data-k="back">⌫</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="calcCancel">Cancel</button>
      <button class="btn btn-primary" id="calcDone">Done</button>
    </div>
  `);

  const disp = document.getElementById('calcDisplay');
  const refresh = () => { disp.innerHTML = displayText() + unitHtml; };
  modalContent.querySelectorAll('.calc-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k;
      fresh = false;
      if (k === 'back') raw = raw.slice(0, -1);
      else if (k === '.') { if (!raw.includes('.')) raw += (raw === '' ? '0.' : '.'); }
      else raw = (raw === '0') ? k : raw + k;
      refresh();
    });
  });
  document.getElementById('calcCancel').onclick = closeModal;
  document.getElementById('calcDone').onclick = () => {
    const result = fresh ? (currentVal != null ? currentVal : '') : raw;
    closeModal();
    onConfirm(result);
  };
}

document.getElementById('addMonthBtn').addEventListener('click', () => {
  const today = new Date();
  const defVal = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  openModal(`
    <h3>Add a month</h3>
    <div class="field">
      <label>Month</label>
      <input type="month" id="newMonthInput" value="${defVal}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelAddMonth">Cancel</button>
      <button class="btn btn-primary" id="confirmAddMonth">Create</button>
    </div>
  `);
  document.getElementById('cancelAddMonth').onclick = closeModal;
  document.getElementById('confirmAddMonth').onclick = () => {
    const val = document.getElementById('newMonthInput').value; // "YYYY-MM"
    if (!val) return;
    const [y,m] = val.split('-').map(Number);
    const key = monthKey(y,m);
    if (!state.months[key]) {
      state.months[key] = buildEmptyMonth(y,m);
    }
    ensurePortfolioMonthValues(key);
    state.activeMonth = key;
    openDayIndex = null;
    saveData();
    closeModal();
    render();
  };
});

document.getElementById('deleteMonthBtn').addEventListener('click', () => {
  const key = state.activeMonth;
  if (!key || !state.months[key]) return;
  const [y,m] = key.split('-').map(Number);
  openModal(`
    <h3>Delete ${MONTH_NAMES[m-1]} ${y}?</h3>
    <p style="color:var(--text-dim);font-size:13.5px;">This removes all entries for this month. This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelDel">Cancel</button>
      <button class="btn btn-primary" style="background:var(--warn);color:#fff;" id="confirmDel">Delete</button>
    </div>
  `);
  document.getElementById('cancelDel').onclick = closeModal;
  document.getElementById('confirmDel').onclick = () => {
    delete state.months[key];
    if (state.portfolio.monthlyValues) delete state.portfolio.monthlyValues[key];
    const keys = sortedMonthKeys();
    state.activeMonth = keys.length ? keys[keys.length-1] : null;
    openDayIndex = null;
    saveData();
    closeModal();
    render();
  };
});

document.getElementById('dataBtn').addEventListener('click', () => {
  const json = JSON.stringify(state, null, 0);
  openModal(`
    <h3>Backup &amp; restore</h3>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:8px;">Everything is stored only on this device. Copy this text somewhere safe to back it up, or paste a backup below to restore it.</p>
    <textarea class="data-io" id="ioArea" readonly>${escapeHtml(json)}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-secondary" id="copyBtn">Copy</button>
      <button class="btn btn-secondary" id="downloadBtn">Download .json</button>
    </div>
    <div class="field" style="margin-top:16px;">
      <label>Restore from backup text</label>
      <textarea class="data-io" id="restoreArea" placeholder="Paste backup JSON here" readonly-="false"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="closeData">Close</button>
      <button class="btn btn-primary" id="restoreBtn">Restore</button>
    </div>
  `);
  document.getElementById('closeData').onclick = closeModal;
  document.getElementById('copyBtn').onclick = () => {
    const area = document.getElementById('ioArea');
    area.removeAttribute('readonly'); area.select();
    try { document.execCommand('copy'); } catch(e) {}
    area.setAttribute('readonly', true);
  };
  document.getElementById('downloadBtn').onclick = () => {
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'saferoad-lon-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('restoreBtn').onclick = () => {
    const txt = document.getElementById('restoreArea').value.trim();
    if (!txt) return;
    try {
      const parsed = JSON.parse(txt);
      if (parsed && parsed.months) {
        state = parsed;
        openDayIndex = null;
        saveData();
        closeModal();
        render();
      } else {
        alert('That does not look like a valid backup.');
      }
    } catch(e) {
      alert('Could not read that backup text.');
    }
  };
});

/* ---------- Init ---------- */
(function init() {
  if (!state.activeMonth || !state.months[state.activeMonth]) {
    const keys = sortedMonthKeys();
    if (keys.length) {
      state.activeMonth = keys[keys.length - 1];
    } else {
      const today = new Date();
      const y = today.getFullYear(), m = today.getMonth() + 1;
      state.months[monthKey(y,m)] = buildEmptyMonth(y,m);
      state.activeMonth = monthKey(y,m);
      ensurePortfolioMonthValues(state.activeMonth);
    }
    saveData();
  }
  render();
})();

</script>
